<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --green: #10a37f; --border: #e8e8ea; --text-muted: #6b6b76; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         width: 360px; margin: 0; color: #16161a; }
  .header { padding: 16px 18px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f0f0f0; }
  .header .title { font-weight: 700; font-size: 16px; flex: 1; letter-spacing: -.01em; }
  .header .icon-btn { cursor: pointer; color: #9a9aa5; font-size: 15px; border: none; background: none;
                       padding: 5px 8px; border-radius: 8px; }
  .header .icon-btn:hover { background: #f1f1f3; color: #333; }
  .subtitle { padding: 4px 18px 10px; font-size: 14px; color: var(--text-muted); }
  .section-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
                    color: #b0b0b6; padding: 10px 18px 4px; }
  .list { padding: 4px 10px 14px; display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; }
  .item-card { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
               font-family: inherit; padding: 12px 12px; border-radius: 12px; border: 1px solid var(--border);
               background: #fff; cursor: pointer; transition: all .12s; }
  .item-card:hover { background: #f7fdfb; border-color: var(--green); }
  .item-icon { font-size: 20px; flex-shrink: 0; width: 38px; height: 38px; display: flex; align-items: center;
               justify-content: center; background: linear-gradient(180deg,#f9f9fa,#f0f0f2); border-radius: 11px;
               border: 1px solid #eee; }
  .item-icon.round { border-radius: 50%; }
  .item-text { flex: 1; min-width: 0; }
  .item-title { font-size: 15px; font-weight: 600; color: #16161a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-arrow { font-size: 19px; color: #c7c7cc; flex-shrink: 0; }
  .empty-hint { padding: 20px 18px; font-size: 14px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
  <div class="header">
    <span class="title"><img src="icons/icon32.png" alt="" style="width:22px;height:22px;vertical-align:-5px;border-radius:5px" /> AI Chat Friendly</span>
    <button class="icon-btn" id="options-link" title="Options">⚙️</button>
  </div>
  <div class="subtitle" id="subtitle">Choose a Tool or Kit to run:</div>
  <div class="list" id="list"></div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
